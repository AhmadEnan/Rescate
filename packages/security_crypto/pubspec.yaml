name: security_crypto
description: Module 5 - Security & Cryptography (Ed25519, Curve25519, SQLCipher)
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: ">=3.19.0"

dependencies:
  cryptography: ^2.9.0
  dev_profiler:
    path: ../dev_profiler
  flutter:
    sdk: flutter
  # Responder Ed25519/X25519 private seeds are kept in the Android Keystore /
  # iOS Keychain, never in a plaintext file (issue #17). Only the
  # SecureStorageSecretStore adapter touches this; ConsultKeyStore itself
  # talks to the SecretStore abstraction so host tests stay plugin-free.
  flutter_secure_storage: ^9.2.2
  path: ^1.9.1
  sqflite: ^2.4.2+1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

resolution: workspace

