# Capped for small VMs (7.8GB RAM, no headroom): repo default was -Xmx8G/-XX:MaxMetaspaceSize=4G
# which OOM-killed a 7.8GB box. GitHub CI runners have more RAM and keep the old values fine.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true

# Fix: Project on F:\ and pub cache on C:\ causes Kotlin incremental compiler to crash
# when trying to compute cross-drive relative paths for its build cache.
kotlin.incremental=false
kotlin.daemon.jvm.options=--enable-native-access=ALL-UNNAMED
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
