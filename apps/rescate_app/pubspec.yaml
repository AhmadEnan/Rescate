name: rescate_app
description: Rescate Main Application containing the Feature-Based UI architecture.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  google_fonts: ^6.2.1
  
  # Core Modular Packages (Local Dependencies)
  ai_inference:
    path: ../../packages/ai_inference
  audio_voice:
    path: ../../packages/audio_voice
  biometric_estimators:
    path: ../../packages/biometric_estimators
  bluetooth_mesh:
    path: ../../packages/bluetooth_mesh
  dev_profiler:
    path: ../../packages/dev_profiler
  offline_data:
    path: ../../packages/offline_data
  security_crypto:
    path: ../../packages/security_crypto
  flutter_animate: ^4.5.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.6.0
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  sensors_plus: ^6.1.2
  flutter_map_tile_caching: ^9.0.1
  nearby_connections: ^4.3.0
  device_info_plus: ^11.0.0
  # Used by ModelSetupScreen to let the user pick their own .gguf model file
  file_picker: ^8.0.0
  # Sandboxed model storage (issue #9): app-private models dir + streaming
  # SHA-256 during import.
  path_provider: ^2.1.4
  crypto: ^3.0.0
  # Hands the badge request out via the system share sheet (issue #17) so no
  # broad storage permission is needed — see issue #24's direction.
  share_plus: ^10.0.0
  # Responder Ed25519/X25519 private seeds live in the Android Keystore /
  # iOS Keychain, never in the app's JSON files (issue #17).
  flutter_secure_storage: ^9.2.2

  sensor_availability:
    path: ../../packages/sensor_availability
  permission_handler: ^12.0.1
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

resolution: workspace

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/learn/cpr/step1/
    - assets/learn/cpr/step2/
    - assets/learn/cpr/step3/
    - assets/learn/cpr/step4/

# Native-assets backend selection moved to the WORKSPACE ROOT pubspec.yaml
# (issue #8): the Dart hook runner reads userDefines from the workspace
# resolution, so a hooks: block here was silently ignored.
